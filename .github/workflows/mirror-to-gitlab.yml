name: Mirror to GitLab

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  workflow_dispatch:

jobs:
  mirror:
    name: Sync to GitLab
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "::error::Secret GITLAB_TOKEN is not set in GitHub repository secrets! Please add your GitLab Personal Access Token or Project Deploy Token to Settings > Secrets and variables > Actions > GITLAB_TOKEN."
            exit 1
          fi

          echo "Configuring GitLab remote..."
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/uvaisubu11/gigo.git"

          echo "Pushing ref ${{ github.ref }} to GitLab..."
          git push --force gitlab "HEAD:${{ github.ref }}"

          echo "Syncing all tags to GitLab..."
          git push --tags gitlab || true
